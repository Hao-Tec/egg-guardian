name: Flutter CI

on:
  push:
    paths:
      - 'mobile/**'
  pull_request:
    paths:
      - 'mobile/**'

jobs:
  test-flutter:
    name: Test Flutter (mobile changes only)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.5'
          channel: 'stable'

      - name: Get dependencies
        working-directory: mobile/egg_guardian
        run: flutter pub get

      - name: Analyze code
        working-directory: mobile/egg_guardian
        run: flutter analyze --no-fatal-infos
